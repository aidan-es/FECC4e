name: Install zizmor
description: Downloads the prebuilt zizmor release used by CI (Linux x86-64 runners)
runs:
  using: composite
  steps:
    - name: Download zizmor
      shell: bash
      env:
        ZIZMOR_VERSION: 1.32.0
        # Change together with ZIZMOR_VERSION
        ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
      run: |
        url="https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
        archive="$RUNNER_TEMP/zizmor.tar.gz"
        curl -sSfL -o "$archive" "$url"
        echo "$ZIZMOR_SHA256  $archive" | sha256sum --check --strict -
        tar -xzf "$archive" -C "$HOME/.cargo/bin" zizmor
        zizmor --version
