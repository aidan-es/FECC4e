name: Install Trunk
description: Downloads the prebuilt Trunk release used by every workflow (Linux x86-64 runners)
runs:
  using: composite
  steps:
    - name: Download Trunk
      shell: bash
      env:
        TRUNK_VERSION: v0.21.14
        # Change together with TRUNK_VERSION
        TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
      run: |
        url="https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz"
        archive="$RUNNER_TEMP/trunk.tar.gz"
        curl -sSfL -o "$archive" "$url"
        echo "$TRUNK_SHA256  $archive" | sha256sum --check --strict -
        tar -xzf "$archive" -C "$HOME/.cargo/bin"
        trunk --version
