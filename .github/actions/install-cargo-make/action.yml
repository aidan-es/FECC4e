name: Install cargo-make
description: Downloads the prebuilt cargo-make release used by CI (Linux x86-64 runners)
runs:
  using: composite
  steps:
    - name: Download cargo-make
      shell: bash
      env:
        CARGO_MAKE_VERSION: 0.37.24
        # Change together with CARGO_MAKE_VERSION
        CARGO_MAKE_SHA256: ff76969f0caab39c56d168b94b2540fde34609aa6562d555081818ece387b005
      run: |
        name="cargo-make-v$CARGO_MAKE_VERSION-x86_64-unknown-linux-musl"
        url="https://github.com/sagiegurari/cargo-make/releases/download/$CARGO_MAKE_VERSION/$name.zip"
        archive="$RUNNER_TEMP/cargo-make.zip"
        curl -sSfL -o "$archive" "$url"
        echo "$CARGO_MAKE_SHA256  $archive" | sha256sum --check --strict -
        unzip -j -o "$archive" "$name/cargo-make" -d "$HOME/.cargo/bin"
        cargo make --version
