name: Upload Cloudflare preview on PR
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    # Dependabot PRs get no Actions secrets, so they can't upload
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Rust Toolchain
        run: rustup toolchain install

      - name: Cache Rust dependencies (Project)
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install Trunk
        uses: ./.github/actions/install-trunk

      - name: Build with Trunk
        working-directory: fecc_gui
        run: trunk build --release

      - name: Upload preview to Cloudflare
        id: upload
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.2"
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPLOAD_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' <<< "$UPLOAD_OUTPUT" | head -n 1)
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "Preview: $url"
