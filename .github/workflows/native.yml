name: Build & Release (Native)

on:
  release:
    types: [ published ] # Runs when you click "Publish Release" in GitHub UI

permissions: {}

env:
  APP_NAME: fe_character_creator

jobs:
  build-and-release:
    name: release-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Uploads the archives to the release
    # Read by the shell, as expanding ${{ }} inside run: would paste the values into the script
    env:
      TARGET: ${{ matrix.target }}
      ARTIFACT_NAME: ${{ matrix.artifact_name }}
      ASSET_NAME: ${{ matrix.asset_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fe_character_creator
            asset_name: fe_character_creator-linux-amd64.tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: fe_character_creator.exe
            # CHANGED: Updated from 'amd64' to 'x64' for better user experience
            asset_name: fe_character_creator-windows-x64.zip
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fe_character_creator
            asset_name: fe_character_creator-macos-arm64.tar.gz
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing here pushes, so the token needn't stay in .git/config for later steps
          persist-credentials: false

      # No rust-cache: releases can't restore the PR caches anyway, and a poisoned cache would ship
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Build binary
        shell: bash
        run: cargo build --release --locked --package fe_character_creator --target "$TARGET"

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: strip "target/$TARGET/release/$ARTIFACT_NAME"

      - name: Refresh third-party licences
        uses: ./.github/actions/refresh-licences

      - name: Prepare staging directory
        shell: bash
        run: |
          mkdir staging
          # Copy binary
          cp "target/$TARGET/release/$ARTIFACT_NAME" "staging/"
          # Copy assets (if they exist)
          if [ -d "assets" ]; then cp -r assets staging/; fi
          if [ -d "art" ]; then cp -r art staging/; fi

      - name: Create Release Archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd staging
          tar -czf "../$ASSET_NAME" *

      - name: Create Release Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path staging/* -DestinationPath $env:ASSET_NAME

      - name: Upload Release Assets
        shell: bash
        # GITHUB_REF_NAME is the release's tag
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET_NAME" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
