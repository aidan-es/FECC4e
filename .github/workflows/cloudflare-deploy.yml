name: Deploy to Cloudflare on release
on:
  release:
    types: [ published ] # Runs when you click "Publish Release" in GitHub UI
  workflow_dispatch: # Runs when you click "Run workflow" in GitHub UI
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Rust Toolchain
        run: rustup toolchain install

      - name: Cache Rust dependencies (Project)
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install Trunk
        uses: ./.github/actions/install-trunk

      - name: Build with Trunk
        working-directory: fecc_gui
        run: trunk build --release

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.2"
          command: deploy
