name: Deploy to Cloudflare on release
on:
  release:
    types: [ published ] # Runs when you click "Publish Release" in GitHub UI
  workflow_dispatch: # Runs when you click "Run workflow" in GitHub UI
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Holds the Cloudflare secrets, so only the jobs it allows can read them
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          # Nothing here pushes, so the token needn't stay in .git/config for later steps
          persist-credentials: false

      # No rust-cache: releases can't restore the PR caches anyway, and a poisoned cache would ship
      - name: Setup Rust Toolchain
        run: rustup toolchain install

      - name: Install Trunk
        uses: ./.github/actions/install-trunk

      - name: Refresh third-party licences
        uses: ./.github/actions/refresh-licences

      - name: Build with Trunk
        working-directory: fecc_gui
        run: trunk build --release

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.2"
          command: deploy
