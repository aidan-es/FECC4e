name: Deploy to Firebase Hosting on merge
on:
  release:
    types: [ published ] # Runs when you click "Publish Release" in GitHub UI

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        run: rustup toolchain install

      - name: Cache Rust dependencies (Project)
        uses: swatinem/rust-cache@v2

      - name: Install Trunk
        uses: ./.github/actions/install-trunk

      - name: Build with Trunk
        working-directory: fecc_gui
        run: trunk build --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FECHARACTERCREATOR }}
          channelId: live
          projectId: fecharactercreator
