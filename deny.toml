# Configures cargo-deny. Run it with `cargo make deny`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
# Vulnerabilities and unsound crates fail wherever they are. Unmaintained crates only fail when
# FECC4e depends on them directly
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Matches fecc_gui/licences/about.toml, so every crate allowed here can be credited
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    # Copyleft licences compatible with FECC4e's AGPLv3. GPL-2.0-only isn't.
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
exceptions = [
    # egui's fonts, subset into the app at build time and credited in the About window
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]
# The copyleft licences are allowed ahead of any crate using them
unused-allowed-license = "allow"

[bans]
# Duplicates come from egui and winit, and only cost build time. List them with `cargo tree -d`.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
